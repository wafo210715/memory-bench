# 记忆系统 MCP server 注册表
# 评测循环 / smoke test 按 system 名拉起对应 server（stdio）。
# env_required：拉起前必须存在的环境变量（缺失时 smoke test 显式报缺，不静默降级）。

servers:
  mock:
    command: ".venv/bin/python"
    args: ["servers/mock/server.py"]

  mem0:
    command: ".venv/bin/python"
    args: ["servers/mem0/server.py"]
    env_required: [MEMBENCH_LLM_API_KEY, MEMBENCH_LLM_BASE_URL, MEMBENCH_LLM_MODEL]

  graphiti:
    command: ".venv/bin/python"
    args: ["servers/graphiti/server.py"]
    env_required: [MEMBENCH_LLM_API_KEY, MEMBENCH_LLM_BASE_URL, MEMBENCH_LLM_MODEL]
    # 另需 docker 容器 membench-neo4j（启动命令见 DEPLOY.md）

  mandol:
    command: ".venv-mandol/bin/python"   # 独立 venv：mandol 锁 numpy<2，与 chromadb 冲突
    args: ["servers/mandol/server.py"]
    env_required: [SILICONFLOW_EMBEDDINGS_URL, SILICONFLOW_API_KEY]

  amem:
    command: ".venv-amem/bin/python"      # 独立 venv：官方 repo agiresearch/A-mem（pip -e）
    args: ["servers/amem/server.py"]
    env_required: [OPENAI_API_KEY, OPENAI_BASE_URL]

  amem_fixed:
    # 同一份上游代码，以 MEMBENCH_AMEM_MODE=fixed 拉起（servers/amem/fixed.py 的 F3/F4/F5/F8/F9）。
    # embedding 换成 embedding-3，与 mem0/graphiti/mandol/rag_baseline 同口径，
    # 故多需 MEMBENCH_LLM_* 两项（embedding 端点从它们推导，同 rag_baseline）。
    command: ".venv-amem/bin/python"
    args: ["servers/amem/server_fixed.py"]
    env_required: [OPENAI_API_KEY, OPENAI_BASE_URL, MEMBENCH_LLM_API_KEY, MEMBENCH_LLM_BASE_URL]

  memos:
    command: ".venv/bin/python"            # 纯 REST，主 venv
    args: ["servers/memos/server.py"]
    # 另需 MemOS compose 栈在 ：8000（启动命令见 DEPLOY.md）

  rag_baseline:
    command: ".venv/bin/python"     # 裸向量 RAG 对照臂（bench-design §3），仅 embedding 无 LLM
    args: ["servers/rag_baseline/server.py"]
    env_required: [MEMBENCH_LLM_API_KEY, MEMBENCH_LLM_BASE_URL]

  intent:
    command: "bun"                        # TS/Bun，与 intent-recall-mcp 同栈
    args: ["run", "servers/intent/server.ts"]
    env_required: [MEMBENCH_LLM_API_KEY, MEMBENCH_LLM_BASE_URL, MEMBENCH_LLM_MODEL]
    # 2026-09-07 起 server.ts 升级为三臂消融版（英文摘要+自包含事实；此 legacy 名等价 intent_full）

  # ---- 意图系统三臂消融（2026-09-07）：一份代码三入口，state/快照共享，入库只做一次 ----
  # B 臂 intent_facts：同构建预算的纯记忆库替身（fact 粒度，mem0 形态）——量"没有意图层能拿几分"
  # C 臂 intent_full ：意图系统（三通道 RRF + session 时间线 envelope + turn_range）
  # D 臂 intent_tier2：C + 检索期 LLM 精读（active 类，B 档单列不进主表）
  # C−B = 同等构建预算下意图层包装的净贡献（粗结论的归因臂）
  intent_full:
    command: "bun"
    args: ["run", "servers/intent/server.ts"]
    env_required: [MEMBENCH_LLM_API_KEY, MEMBENCH_LLM_BASE_URL, MEMBENCH_LLM_MODEL]

  intent_facts:
    command: "bun"
    args: ["run", "servers/intent/server_facts.ts"]
    env_required: [MEMBENCH_LLM_API_KEY, MEMBENCH_LLM_BASE_URL, MEMBENCH_LLM_MODEL]

  intent_tier2:
    command: "bun"
    args: ["run", "servers/intent/server_tier2.ts"]
    env_required: [MEMBENCH_LLM_API_KEY, MEMBENCH_LLM_BASE_URL, MEMBENCH_LLM_MODEL]

  # 待封装（Phase 1 后续）：
  # graphiti: Neo4j Docker + neo4j-admin dump 快照
  # memos / a-mem / mandol / intent
